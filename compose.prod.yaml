# Producción en Dokploy (servicio Docker Compose). Dominios en la UI de Dokploy:
#   frontend -> FRONTEND_URL (p. ej. folio.nube-tec.com),     puerto 8080
#   backend  -> API_URL      (p. ej. api-folio.nube-tec.com), puerto 3001
# La base MySQL o MariaDB es externa (DATABASE_URL). Variables: ver .env.dokploy.example.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Configura GOOGLE_CLIENT_ID}
      OWNER_EMAIL: ${OWNER_EMAIL:?Configura OWNER_EMAIL}
      DATA_DIR: /data
      PORT: 3001
      MAX_PAGES: ${MAX_PAGES:-500}
      CONVERSION_TIMEOUT_MS: ${CONVERSION_TIMEOUT_MS:-120000}
      # El frontend llama a la API desde otro subdominio: solo ese origen recibe CORS con credenciales.
      CORS_ORIGINS: ${FRONTEND_URL:?Configura FRONTEND_URL}
    expose:
      - "3001"
    volumes:
      # Documentos y la clave de las sesiones (.jwt-secret).
      - document_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_API_URL: ${API_URL:?Configura API_URL}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  document_data:
