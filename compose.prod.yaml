services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Configura MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:?Configura MYSQL_USER}:${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:?Configura MYSQL_DATABASE}
      DATA_DIR: /data
      PORT: 3001
      MAX_FILE_MB: ${MAX_FILE_MB:-0}
      MAX_PAGES: ${MAX_PAGES:-500}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-24}
      CONVERSION_TIMEOUT_MS: ${CONVERSION_TIMEOUT_MS:-120000}
      ADMIN_USER: ${ADMIN_USER:?Configura ADMIN_USER}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Configura ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET}
    volumes:
      - document_data:/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  document_data:
