services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      # Base MySQL o MariaDB externa; ver .env.example.
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Configura GOOGLE_CLIENT_ID}
      OWNER_EMAIL: ${OWNER_EMAIL:?Configura OWNER_EMAIL}
      DATA_DIR: /data
      MAX_PAGES: ${MAX_PAGES:-500}
      CONVERSION_TIMEOUT_MS: ${CONVERSION_TIMEOUT_MS:-120000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - document_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY: http://backend:3001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  document_data:
