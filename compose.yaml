services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-folio}
      MYSQL_USER: ${MYSQL_USER:-folio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-folio_local_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-folio_root_local_dev}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-folio}:${MYSQL_PASSWORD:-folio_local_dev}@mysql:3306/${MYSQL_DATABASE:-folio}
      DATA_DIR: /data
      MAX_FILE_MB: ${MAX_FILE_MB:-50}
      MAX_PAGES: ${MAX_PAGES:-500}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-24}
      CONVERSION_TIMEOUT_MS: ${CONVERSION_TIMEOUT_MS:-120000}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - document_data:/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY: http://backend:3001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql_data:
  document_data:
