server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API se publica en su propio subdominio (API_URL); aquí solo se sirve la app estática.

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
